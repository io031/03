#bar .pb{height:36px;padding:0 16px;font-size:15px}

.wk{font-weight:600;text-align:center;font-size:22px;margin-top:12px}

@keyframes wob{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
#bub{position:absolute;z-index:5;left:114px;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 126px);box-sizing:border-box;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 13px;font-size:15px;font-weight:500;line-height:1.4;word-break:keep-all}
#bub:before{content:'';position:absolute;left:-17px;bottom:12px;border:9px solid transparent;border-left:0;border-right:14px solid var(--ink)}
#bub:after{content:'';position:absolute;left:-12px;bottom:15px;border:6px solid transparent;border-left:0;border-right:12px solid #fff}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#ch.talk,#v{animation:none}}

 {n:'뱃사람의 별',d:'단편선의 마지막 테마예요. 메인 스토리에서 벗어난 세계관만 공유하는 테마고, 성수점에서 졸업 선물을 주기 때문에 마지막 졸업 테마로 추천해요.'}];
const $=s=>document.querySelector(s),WK='일월화수목금토',PREV={theme:'start',date:'theme',sum:'date'};
const S={sc:'start',t:null,m:0,d:0};
const n0=new Date(),today=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate());
const dim=m=>new Date(today.getFullYear()+(m<today.getMonth()+1?1:0),m,0).getDate();
const wk=(m,d)=>{const y=today.getFullYear();return WK[new Date(new Date(y,m-1,d)<today?y+1:y,m-1,d).getDay()]};
let tw;
function say(t){clearInterval(tw);const a=$('#ta'),b=$('#tb'),c=$('#ch');a.textContent='';b.textContent=t;c.classList.add('talk');let i=0;
 tw=setInterval(()=>{i++;a.textContent=t.slice(0,i);b.textContent=t.slice(i);if(i>=t.length){clearInterval(tw);c.classList.remove('talk')}},60)}
function upd(){const a=$('#act');a.hidden=$('#back').hidden=S.sc=='start';a.textContent=S.sc=='sum'?'공유':'확인';
 a.disabled=(S.sc=='theme'&&S.t===null)||(S.sc=='date'&&!(S.m&&S.d))}
function fillD(){const n=S.m?dim(S.m):31;if(S.d>n)S.d=0;
 $('#d').innerHTML='<option value="0">—</option>'+Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
 $('#d').value=S.d;upd()}
function go(sc){S.sc=sc;const v=$('#v');v.style.animation='none';void v.offsetWidth;v.style.animation='';v.style.margin=sc=='theme'?'0 0 auto':'';$('#sc').style.paddingTop=sc=='theme'?'calc(var(--w)*230/700 + env(safe-area-inset-top,0px))':'';
 if(sc=='start'){v.innerHTML='<h1>방탈출<br>계획</h1><button class="rb" id="go">계획 짜기</button>';say('안녕하세요')}
 else if(sc=='theme'){v.innerHTML=TH.map((t,i)=>`<button class="pb th${S.t===i?' on':''}" data-i="${i}">${t.n}</button>`).join('');say('테마를 골라주세요')}
 else if(sc=='date'){const o=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  v.innerHTML=`<div class="card"><div class="row"><label class="sel"><select id="m"><option value="0">—</option>${o}</select></label><b>월</b><label class="sel"><select id="d"></select></label><b>일</b></div></div>`;
  $('#m').value=S.m;fillD();say('날짜를 골라주세요')}
 else{v.innerHTML=`<div class="card"><div class="lab">테마</div><div class="val">${TH[S.t].n}</div><div class="lab">날짜</div><div class="val">${S.m}월 ${S.d}일</div><button class="lnk" id="redo">처음부터 다시</button></div>`;say('이렇게 정했어요!')}
 upd()}
async function share(){
 const text=`${TH[S.t].n}\n${S.m}월 ${S.d}일`;
 if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name=='AbortError')return}}
 let ok=false;
 try{await navigator.clipboard.writeText(text);ok=true}catch(e){
  const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);
  t.select();t.setSelectionRange(0,999);try{ok=document.execCommand('copy')}catch(_){}t.remove()}
 say(ok?'공유창을 열 수 없어서 복사했어요. 카톡에 붙여넣어 주세요':'공유창을 열 수 없어요. 위 내용을 길게 눌러 복사해 주세요')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='go')go('theme');
 else if(b.id=='back')go(PREV[S.sc]);
 else if(b.dataset.i!=null){S.t=+b.dataset.i;document.querySelectorAll('.th').forEach(x=>x.classList.toggle('on',x===b));say(TH[S.t].d);upd()}
 else if(b.id=='act'){if(S.sc=='theme')go('date');else if(S.sc=='date')go('sum');else share()}
 else if(b.id=='redo'){S.t=null;S.m=S.d=0;go('theme')}});
document.addEventListener('change',e=>{if(e.target.id=='m'){S.m=+e.target.value;fillD()}else if(e.target.id=='d'){S.d=+e.target.value;fillD()}});
go('start');
</script></body></html>
